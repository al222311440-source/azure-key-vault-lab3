# Activate with SPRING_PROFILES_ACTIVE=azure.
# Uses JVM trusted certificate authorities and validates the database hostname.
spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:school_management}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory&connectTimeout=10&tcpKeepAlive=true"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
server:
  forward-headers-strategy: framework
