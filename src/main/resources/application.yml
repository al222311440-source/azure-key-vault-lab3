spring:
  application:
    name: school-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/school_management}
    username: ${DB_USERNAME:school_management}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html
logging:
  level:
    root: INFO
    mx.edu.utvt.schoolmanagement: ${APP_LOG_LEVEL:INFO}
